name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sidequest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Configure test environment
        run: |
          cat <<EOF > .env
          DATABASE_HOST=localhost
          DATABASE_PORT=5432
          DATABASE_NAME=sidequest_test
          DATABASE_USER=postgres
          DATABASE_PASSWORD=postgres
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/sidequest_test
          JWT_SECRET_TOKEN=ci-test-secret
          LOG_LEVEL=error
          EOF

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  frontend:
    name: Frontend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
